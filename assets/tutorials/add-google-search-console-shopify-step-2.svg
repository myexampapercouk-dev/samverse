<title id="t">Shopify domain DNS settings with Google verification TXT record</title><desc id="d">Illustrated Shopify admin domain DNS settings showing A, CNAME and MX records with a new TXT record for @ containing google-site-verification highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
