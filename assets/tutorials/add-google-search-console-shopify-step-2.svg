"12" font-family="ui-monospace,Consolas,monospace">www</text><text x="446" y="225" font-size="12" font-family="ui-monospace,Consolas,monospace">shops.myshopify.com</text><text x="816" y="225" font-size="12">3600</text><line x1="240" y1="240" x2="936" y2="240" stroke="#e1e3e5"/><text x="256" y="265" font-weight="600">MX</text><text x="336" y="265" font-size="12" font-family="ui-monospace,Consolas,monospace">@</text><text x="446" y="265" font-size="12" font-family="ui-monospace,Consolas,monospace">your email provider</text><text x="816" y="265" font-size="12">10</text><line x1="240" y1="280" x2="936" y2="280" stroke="#e1e3e5"/><text x="256" y="305" font-weight="600">TXT</text><text x="336" y="305" font-size="12" font-family="ui-monospace,Consolas,monospace">@</text><text x="446" y="305" font-size="12" font-family="ui-monospace,Consolas,monospace">google-site-verification=abc123…</text><text x="816" y="305" font-size="12">3600</text><rect x="238" y="280" width="712" height="48" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M503.2 420 Q508.6 373 594 326" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="420" width="286.4" height="34" rx="17" fill="#c2410c"/><text x="503.2" y="442" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">New TXT on @, nothing else changes</text><rect x="4" y="254" width="202" height="38" rx="6" fill="none" stroke="#d63638" stroke-width="3"/>
