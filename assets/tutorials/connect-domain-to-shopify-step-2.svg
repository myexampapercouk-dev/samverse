>MX</text><text x="350" y="312" fill="#8c8f94">@</text><text x="470" y="312" fill="#8c8f94" font-family="ui-monospace,Consolas,monospace">mail provider (leave as is)</text><text x="760" y="312" fill="#8c8f94">3600</text><line x1="240" y1="332" x2="936" y2="332" stroke="#e1e3e5"/><text x="264" y="364" fill="#8c8f94" font-weight="600">TXT</text><text x="350" y="364" fill="#8c8f94">@</text><text x="470" y="364" fill="#8c8f94" font-family="ui-monospace,Consolas,monospace">v=spf1 ... (leave as is)</text><text x="760" y="364" fill="#8c8f94">3600</text><rect x="244" y="176" width="652" height="108" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M539.4 410 Q514.7 346 570 282" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="410" width="278.79999999999995" height="34" rx="17" fill="#c2410c"/><text x="539.4" y="432" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Only change the A and www records</text>
