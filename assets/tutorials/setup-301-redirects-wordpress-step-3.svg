text x="214" y="156" font-size="13" font-weight="600">Source URL</text><rect x="214" y="166" width="520" height="34" rx="4" fill="#fff" stroke="#8c8f94"/><text x="226" y="188" fill="#1d2327" font-family="ui-monospace,Consolas,monospace">^/\d{4}/\d{2}/\d{2}/(.*)$</text><text x="750" y="188" font-weight="600">Regex</text><rect x="806" y="176" width="16" height="16" rx="3" fill="#fff" stroke="#8c8f94"/><path d="M809 184l4 4 6-8" fill="none" stroke="#2271b1" stroke-width="2.4"/><text x="214" y="224" font-size="13" font-weight="600">Target URL</text><rect x="214" y="234" width="520" height="34" rx="4" fill="#fff" stroke="#8c8f94"/><text x="226" y="256" fill="#1d2327" font-family="ui-monospace,Consolas,monospace">/$1</text><text x="214" y="304" font-weight="600">HTTP code</text><rect x="300" y="288" width="260" height="30" rx="3" fill="#fff" stroke="#8c8f94"/><text x="312" y="308">301 - Moved Permanently</text><rect x="214" y="340" width="120" height="30" rx="3" fill="#2271b1" stroke="#2271b1"/><text x="274" y="360" font-size="13" fill="#fff" text-anchor="middle">Add Redirect</text><text x="214" y="410" fill="#50575e" font-family="ui-monospace,Consolas,monospace">Example: /2024/05/12/website-cost/ → /website-cost/</text><rect x="738" y="164" width="100" height="40" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M721.4 250 Q690.7 217 740 184" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="620" y="250" width="202.79999999999998" height="34" rx="17" fill="#c2410c"/><text x="721.4" y="272" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Tick Regex for patterns</text><rect x="290" y="278" width="280" height="50" rx="6" fill="none" stroke="#d63638" stroke-width="3"/>
