<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#1d2327">
<title id="t">Zoho Mail Admin Console domain verification with TXT method</title><desc id="d">Illustrated Zoho Mail Admin Console Domains page showing the TXT verification method, the zoho-verification value to copy and the Verify TXT Record button highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#f0f0f1"/>
<rect x="0" y="0" width="960" height="52" fill="#fff" stroke="#e1e3e5"/><text x="22" y="33" font-size="17" fill="#c8202f" font-weight="600">Zoho Mail Admin Console</text><text x="938" y="33" fill="#4a4a63" text-anchor="end">yourdomain.com</text><rect x="0" y="52" width="210" height="508" fill="#fff" stroke="#e1e3e5"/><text x="22" y="86" font-size="14" fill="#303030" font-weight="600">Dashboard</text><text x="22" y="118" font-size="14" fill="#303030" font-weight="600">Users</text><text x="22" y="150" font-size="14" fill="#303030" font-weight="600">Groups</text><rect x="8" y="162" width="194" height="30" rx="6" fill="#fdecee"/><text x="22" y="182" font-size="14" fill="#c8202f" font-weight="600">Domains</text><text x="22" y="214" font-size="14" fill="#303030" font-weight="600">Mail Settings</text><text x="22" y="246" font-size="14" fill="#303030" font-weight="600">Security</text><text x="240" y="96" font-size="20" font-weight="600">Verify yourdomain.com</text><rect x="240" y="120" width="696" height="330" rx="10" fill="#fff" stroke="#e1e3e5"/><text x="264" y="156" font-weight="600">Method:</text><circle cx="348" cy="152" r="8" fill="#fff" stroke="#8c8f94"/><circle cx="348" cy="152" r="4" fill="#2271b1"/><text x="364" y="157">TXT</text><circle cx="428" cy="152" r="8" fill="#fff" stroke="#8c8f94"/><text x="444" y="157">CNAME</text><circle cx="528" cy="152" r="8" fill="#fff" stroke="#8c8f94"/><text x="544" y="157">HTML</text><text x="264" y="200" fill="#5c6370">Add this record in your DNS manager:</text><text x="264" y="220" font-size="13" font-weight="600">Host / Name</text><rect x="264" y="230" width="200" height="34" rx="4" fill="#fff" stroke="#8c8f94"/><text x="276" y="252" fill="#1d2327" font-family="ui-monospace,Consolas,monospace">@</text><text x="484" y="220" font-size="13" font-weight="600">TXT value</text><rect x="484" y="230" width="420" height="34" rx="4" fill="#fff" stroke="#8c8f94"/><text x="496" y="252" fill="#1d2327" font-family="ui-monospace,Consolas,monospace">zoho-verification=zb12345678.zmverify.zoho.in</text><rect x="264" y="380" width="170" height="30" rx="6" fill="#c8202f"/><text x="349" y="400" fill="#fff" font-weight="600" text-anchor="middle">Verify TXT Record</text><rect x="258" y="224" width="652" height="46" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M628 330 Q566 299 584 268" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="330" width="256" height="34" rx="17" fill="#c2410c"/><text x="628" y="352" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Copy into your DNS as TXT on @</text><rect x="256" y="372" width="186" height="46" rx="8" fill="none" stroke="#d63638" stroke-width="3"/>
<rect x="746" y="534" width="206" height="20" rx="4" fill="#ffffff" stroke="#dcdcde"/><text x="849" y="548" font-size="10.5" fill="#646970" text-anchor="middle">Illustration by Samverse, not a screenshot</text>
