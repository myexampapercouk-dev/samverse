xt><text x="446" y="257" font-size="12" font-family="ui-monospace,Consolas,monospace">mx2.zoho.in</text><text x="816" y="257" font-size="12">20</text><line x1="240" y1="272" x2="936" y2="272" stroke="#e1e3e5"/><text x="256" y="297" font-weight="600">MX</text><text x="336" y="297" font-size="12" font-family="ui-monospace,Consolas,monospace">@</text><text x="446" y="297" font-size="12" font-family="ui-monospace,Consolas,monospace">mx3.zoho.in</text><text x="816" y="297" font-size="12">50</text><line x1="240" y1="312" x2="936" y2="312" stroke="#e1e3e5"/><text x="256" y="337" font-weight="600">TXT</text><text x="336" y="337" font-size="12" font-family="ui-monospace,Consolas,monospace">@</text><text x="446" y="337" font-size="12" font-family="ui-monospace,Consolas,monospace">v=spf1 include:zoho.in ~all</text><text x="816" y="337" font-size="12">3600</text><line x1="240" y1="352" x2="936" y2="352" stroke="#e1e3e5"/><text x="256" y="377" font-weight="600">TXT</text><text x="336" y="377" font-size="12" font-family="ui-monospace,Consolas,monospace">zmail._domainkey</text><text x="446" y="377" font-size="12" font-family="ui-monospace,Consolas,monospace">v=DKIM1; k=rsa; p=MIGf…</text><text x="816" y="377" font-size="12">3600</text><rect x="238" y="190" width="712" height="248" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M497.6 470 Q505.79999999999995 453 594 436" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="400" y="470" width="195.2" height="34" rx="17" fill="#c2410c"/><text x="497.6" y="492" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Zoho MX, one SPF, DKIM</text>
