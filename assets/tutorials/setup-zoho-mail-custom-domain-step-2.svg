<title id="t">DNS zone with Zoho MX, SPF and DKIM records</title><desc id="d">Illustrated DNS zone listing three Zoho MX records with priorities 10, 20 and 50, an SPF TXT record including zoho.in and a DKIM TXT record on zmail._domainkey, highlighted.</desc>
