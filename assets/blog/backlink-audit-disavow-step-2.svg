<title id="t">Google disavow links tool Upload disavow list for a Search Console property</title><desc id="d">Illustrated Google Search Console disavow links tool with a domain property selected and the Upload disavow list button highlighted, with a note that a new file replaces the old one.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#f0f0f1"/>
<rect x="0" y="0" width="960" height="56" fill="#fff" stroke="#dadce0"/><text x="24" y="35" font-size="17" fill="#5f6368">Google Search Console</text><text x="120" y="120" font-size="24">Disavow links</text><text x="120" y="150" fill="#5f6368">Select a property to manage its disavowed links.</text><rect x="120" y="172" width="420" height="40" rx="4" fill="#fff" stroke="#9aa0a6"/><text x="136" y="197">yourdomain.com (domain property)</text><text x="520" y="197" fill="#5f6368" text-anchor="middle">▾</text><rect x="120" y="240" width="720" height="180" rx="8" fill="#fff" stroke="#dadce0"/><text x="144" y="276" font-size="14">No disavow file has been uploaded for this property.</text><text x="144" y="304" font-size="12.5" fill="#5f6368">Upload a .txt file with one domain: entry or URL per line. A new upload replaces the current file.</text><rect x="144" y="336" width="190" height="38" rx="4" fill="#1a73e8"/><text x="239" y="361" fill="#fff" font-weight="600" text-anchor="middle">Upload disavow list</text><rect x="138" y="330" width="202" height="50" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M585.2 460 Q421.6 407.5 338 355" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="480" y="460" width="210.39999999999998" height="34" rx="17" fill="#c2410c"/><text x="585.2" y="482" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Keep a master copy first</text>
<rect x="746" y="534" width="206" height="20" rx="4" fill="#ffffff" stroke="#dcdcde"/><text x="849" y="548" font-size="10.5" fill="#646970" text-anchor="middle">Illustration by Samverse, not a screenshot</text>
