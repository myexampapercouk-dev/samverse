<title id="t">WordPress block editor link control adding an internal link to an orphan page</title><desc id="d">Illustrated WordPress block editor with a phrase selected in a paragraph and the link popover open, a search for the orphan page typed and the matching page result highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
