<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#1d2327">
<title id="t">.htaccess in a hosting File Manager with a malicious RewriteRule redirect</title><desc id="d">Illustrated hosting File Manager editor with public_html/.htaccess open; a RewriteCond and RewriteRule block sending search and mobile visitors to a spam domain sits above the BEGIN WordPress block and is highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#f0f0f1"/>
<rect x="0" y="0" width="960" height="50" fill="#fff" stroke="#dcdcde"/><text x="20" y="31" font-size="17" font-weight="600">File Manager</text><text x="170" y="31" fill="#50575e">public_html / .htaccess</text><rect x="830" y="10" width="110" height="30" rx="4" fill="#2271b1"/><text x="885" y="30" fill="#fff" font-weight="600" text-anchor="middle">Save</text><rect x="0" y="50" width="960" height="510" fill="#1e1e1e"/><text x="44" y="84" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">1</text><text x="64" y="84" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteEngine On</text><text x="44" y="110" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">2</text><text x="64" y="110" font-size="13" fill="#f48771" font-family="ui-monospace,Consolas,monospace">RewriteCond %{HTTP_REFERER} (google|bing|facebook) [NC]</text><text x="44" y="136" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">3</text><text x="64" y="136" font-size="13" fill="#f48771" font-family="ui-monospace,Consolas,monospace">RewriteCond %{HTTP_USER_AGENT} (android|iphone|mobile) [NC]</text><text x="44" y="162" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">4</text><text x="64" y="162" font-size="13" fill="#f48771" font-family="ui-monospace,Consolas,monospace">RewriteRule ^(.*)$ https://spam-domain.example/ [R=302,L]</text><text x="44" y="188" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">5</text><text x="64" y="188" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace"></text><text x="44" y="214" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">6</text><text x="64" y="214" font-size="13" fill="#6a9955" font-family="ui-monospace,Consolas,monospace"># BEGIN WordPress</text><text x="44" y="240" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">7</text><text x="64" y="240" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">&lt;IfModule mod_rewrite.c&gt;</text><text x="44" y="266" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">8</text><text x="64" y="266" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteEngine On</text><text x="44" y="292" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">9</text><text x="64" y="292" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteBase /</text><text x="44" y="318" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">10</text><text x="64" y="318" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteRule ^index\.php$ - [L]</text><text x="44" y="344" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">11</text><text x="64" y="344" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteCond %{REQUEST_FILENAME} !-f</text><text x="44" y="370" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">12</text><text x="64" y="370" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteCond %{REQUEST_FILENAME} !-d</text><text x="44" y="396" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">13</text><text x="64" y="396" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">RewriteRule . /index.php [L]</text><text x="44" y="422" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">14</text><text x="64" y="422" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">&lt;/IfModule&gt;</text><text x="44" y="448" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">15</text><text x="64" y="448" font-size="13" fill="#6a9955" font-family="ui-monospace,Consolas,monospace"># END WordPress</text><rect x="54" y="60" width="532" height="114" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M690 300 Q597 208.5 584 117" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="300" width="180" height="34" rx="17" fill="#c2410c"/><text x="690" y="322" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Not yours? Remove it</text>
<rect x="746" y="534" width="206" height="20" rx="4" fill="#ffffff" stroke="#dcdcde"/><text x="849" y="548" font-size="10.5" fill="#646970" text-anchor="middle">Illustration by Samverse, not a screenshot</text>
</svg>
