<title id="t">WordPress Site Identity Site Icon favicon setting, select site icon at least 512 by 512 pixels</title><desc id="d">Illustrated WordPress Customizer Site Identity section showing Logo, Site Title, Tagline and the Site Icon setting with the Select site icon button highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
