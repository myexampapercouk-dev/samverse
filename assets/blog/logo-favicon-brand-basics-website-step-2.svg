owser tab</text><rect x="10" y="422" width="280" height="62" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M567 334 Q467.5 393.5 288 453" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="300" width="294" height="34" rx="17" fill="#c2410c"/><text x="567" y="322" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Square image, at least 512 × 512 px</text><rect x="356" y="52" width="28" height="28" rx="6" fill="none" stroke="#d63638" stroke-width="3"/>
