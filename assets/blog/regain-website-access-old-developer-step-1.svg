<title id="t">Domain registrar domain settings with Domain lock and Transfer authorisation (EPP) code</title><desc id="d">Illustrated generic domain registrar Domain settings screen showing the registrant, the Domain lock switch and the Transfer authorisation code (EPP code) with a Show code button, highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#f0f0f1"/>
<rect x="0" y="0" width="960" height="56" fill="#fff" stroke="#dcdcde"/><text x="24" y="35" font-size="17" font-weight="600">Domain registrar</text><text x="936" y="35" fill="#50575e" text-anchor="end">My account</text><text x="40" y="100" font-size="22" font-weight="600">yourdomain.com</text><text x="40" y="126" fill="#50575e">Domain settings</text><rect x="40" y="146" width="880" height="64" rx="6" fill="#fff" stroke="#dcdcde"/><text x="64" y="174" font-weight="600">Registrant (owner)</text><text x="64" y="194" font-size="12.5" fill="#50575e">The name the domain is registered to. It should be your business.</text><rect x="40" y="222" width="880" height="64" rx="6" fill="#fff" stroke="#dcdcde"/><text x="64" y="250" font-weight="600">Expiry date</text><text x="64" y="270" font-size="12.5" fill="#50575e">Turn on auto-renew so the domain never lapses.</text><rect x="840" y="244" width="40" height="20" rx="10" fill="#2271b1"/><circle cx="870" cy="254" r="7" fill="#fff"/><rect x="40" y="298" width="880" height="64" rx="6" fill="#fff" stroke="#dcdcde"/><text x="64" y="326" font-weight="600">Domain lock</text><text x="64" y="346" font-size="12.5" fill="#50575e">Turn off only while you transfer the domain.</text><rect x="840" y="320" width="40" height="20" rx="10" fill="#2271b1"/><circle cx="870" cy="330" r="7" fill="#fff"/><rect x="40" y="374" width="880" height="64" rx="6" fill="#fff" stroke="#dcdcde"/><text x="64" y="402" font-weight="600">Transfer authorisation code (EPP code)</text><text x="64" y="422" font-size="12.5" fill="#50575e">Needed by the new registrar to move the domain.</text><rect x="800" y="390" width="100" height="30" rx="3" fill="#f6f7f7" stroke="#2271b1"/><text x="850" y="410" font-size="13" fill="#2271b1" text-anchor="middle">Show code</text><rect x="40" y="298" width="882" height="152" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M472.8 470 Q436.9 459 481 448" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="470" width="225.6" height="34" rx="17" fill="#c2410c"/><text x="472.8" y="492" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Unlock, then copy the code</text>
