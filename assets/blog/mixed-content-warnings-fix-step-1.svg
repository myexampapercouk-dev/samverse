<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#1d2327">
<title id="t">Chrome DevTools Console Mixed Content warning for an insecure image</title><desc id="d">Illustrated Chrome DevTools Console tab showing a yellow Mixed Content warning: the page was loaded over HTTPS but requested an insecure image over http, with the insecure URL highlighted.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d63638"/></marker></defs>
<rect x="0" y="0" width="960" height="560" fill="#f0f0f1"/>
<rect x="0" y="0" width="960" height="40" fill="#f1f3f4"/><rect x="12" y="8" width="600" height="24" rx="12" fill="#fff"/><text x="30" y="25" fill="#3c4043">https://yourdomain.com/</text><rect x="0" y="40" width="960" height="180" fill="#fff"/><text x="40" y="120" font-size="20" fill="#9aa0a6">Your page</text><rect x="0" y="220" width="960" height="34" fill="#f1f3f4" stroke="#dadce0"/><text x="20" y="242" fill="#5f6368">Elements</text><text x="110" y="242" fill="#1a73e8" font-weight="600">Console</text><rect x="104" y="250" width="70" height="3" fill="#1a73e8"/><text x="196" y="242" fill="#5f6368">Sources</text><text x="278" y="242" fill="#5f6368">Network</text><text x="362" y="242" fill="#5f6368">Security</text><rect x="0" y="254" width="960" height="306" fill="#fff"/><rect x="0" y="270" width="960" height="70" fill="#fef7e0" stroke="#f9e3a1"/><text x="20" y="292" font-size="14" fill="#b06000">⚠</text><text x="44" y="292" font-size="12.5" fill="#5c3c00" font-family="ui-monospace,Consolas,monospace">Mixed Content: The page at 'https://yourdomain.com/' was loaded over HTTPS, but requested an insecure</text><text x="44" y="312" font-size="12.5" fill="#5c3c00" font-family="ui-monospace,Consolas,monospace">image 'http://yourdomain.com/wp-content/uploads/logo.png'. This content should also be served over HTTPS.</text><text x="20" y="370" fill="#1a73e8" font-family="ui-monospace,Consolas,monospace">&gt;</text><rect x="84" y="292" width="432" height="32" rx="8" fill="none" stroke="#d63638" stroke-width="3"/><path d="M676.6 410 Q555.3 359 514 308" fill="none" stroke="#d63638" stroke-width="3" marker-end="url(#ah)"/><rect x="560" y="410" width="233.2" height="34" rx="17" fill="#c2410c"/><text x="676.6" y="432" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">This URL still uses http://</text>
<rect x="746" y="534" width="206" height="20" rx="4" fill="#ffffff" stroke="#dcdcde"/><text x="849" y="548" font-size="10.5" fill="#646970" text-anchor="middle">Illustration by Samverse, not a screenshot</text>
</svg>
