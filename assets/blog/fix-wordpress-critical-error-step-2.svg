mily="ui-monospace,Consolas,monospace">84</text><text x="64" y="240" font-size="13" fill="#dcdcaa" font-family="ui-monospace,Consolas,monospace">define( 'WP_DEBUG', true );</text><text x="44" y="266" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">85</text><text x="64" y="266" font-size="13" fill="#dcdcaa" font-family="ui-monospace,Consolas,monospace">define( 'WP_DEBUG_LOG', true );</text><text x="44" y="292" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">86</text><text x="64" y="292" font-size="13" fill="#dcdcaa" font-family="ui-monospace,Consolas,monospace">define( 'WP_DEBUG_DISPLAY', false );</text><text x="44" y="318" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">87</text><text x="64" y="318" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace"></text><text x="44" y="344" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">88</text><text x="64" y="344" font-size="13" fill="#6a9955" font-family="ui-monospace,Consolas,monospace">/* That's all, stop editing! Happy publishing. */</text><text x="44" y="370" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">89</text><text x="64" y="370" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace"></text><text x="44" y="396" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">90</text><text x="64" y="396" font-size="13" fill="#6a9955" font-family="ui-monospace,Consolas,monospace">/** Absolute path to the WordPress directory. */</text><text x="44" y="422" font-size="13" fill="#858585" text-anchor="end" font-family="ui-monospace,Consolas,monospace">91</text><text x="64" y="422" font-size="13" fill="#d4d4d4" font-family="ui-monospace,Consolas,monospace">if ( ! defined( 'ABSPATH' ) ) {</text><rect x="54" y="224" width="34